<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Solareco form registration</title>
  </head>
  <body>
    <form name="quotation-request" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="quotation-request" />
      <input name="bot-field" />
      <input name="name" />
      <input name="company" />
      <input name="email" type="email" />
      <input name="phone" />
      <input name="location" />
      <input name="product" />
      <textarea name="message"></textarea>
      <input name="consent" />
    </form>
  </body>
</html>
